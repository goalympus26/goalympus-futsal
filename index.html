<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOALYMPUS 핏투게더 EPTS 장비 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 디자인 기준: GOALYMPUS 포스터. 하늘색 바탕, 빨강 GOAL, 네이비 YMPUS, 로열블루 숫자, 넓게 벌린 한글 소제목.
   구성: 상단 히어로(워드마크) · 탭 · 본문 · 하단 행사 정보 띠. 입력은 구글 시트에서 한다. */
:root{
  --bg:#EAF2FD; --surface:#FFFFFF; --ink:#0E2356; --muted:#5A6B8C; --line:#C9D8EF;
  --navy:#0E2356; --red:#E9232B; --royal:#2A52A8; --sky1:#6FAEEF; --sky2:#BCD9F8;
  --ok:#168A5B; --live:#E9232B; --warn:#B26A00; --gold:#F2C94C; --silver:#C9CFCB; --bronze:#E0A57C;
  --c1:#2F6FDB; --c2:#C98500; --c3:#D6455D; --c4:#7A4BC9;
  --hero-ink:#0E2356; --y-color:#0E2356; --mg:#B07A00;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mark:"Anton","Impact","Arial Black","Haettenschweiler",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1630; --surface:#12254A; --ink:#EAF0FF; --muted:#9DB0D6; --line:#22396B;
  --navy:#EAF0FF; --royal:#7FA6FF; --sky1:#0B1F4D; --sky2:#0A1630; --ok:#4CC28F; --live:#FF6B5E; --warn:#F0B14A;
  --c1:#6EA2FF; --c2:#F0B53A; --c3:#FF7C92; --c4:#B496F2; --hero-ink:#EAF0FF; --y-color:#FFFFFF; --mg:#FFD83A; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(0px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto}
/* 히어로 */
.hero{position:relative;overflow:hidden;text-align:center;
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 20px;
  background:
    radial-gradient(55% 90% at 12% 25%,rgba(255,255,255,.85),transparent 62%),
    radial-gradient(45% 80% at 88% 8%,rgba(255,255,255,.75),transparent 62%),
    radial-gradient(40% 60% at 60% 85%,rgba(255,255,255,.55),transparent 65%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 75%,var(--bg) 100%);}
@media (prefers-color-scheme: dark){.hero{background:radial-gradient(60% 90% at 20% 0%,rgba(80,130,230,.35),transparent 65%),linear-gradient(180deg,#0B1F4D 0%,#0A1630 100%);}}
.hero-in{max-width:980px;margin:0 auto;position:relative}
.sub1{font-size:clamp(11px,2.6vw,17px);font-weight:500;letter-spacing:.42em;color:var(--hero-ink);padding-left:.42em}
.mark{font-family:var(--f-mark);font-size:clamp(46px,14vw,104px);line-height:1;letter-spacing:-.01em;transform:skewX(-8deg);margin:6px 0 4px;white-space:nowrap}
.mark .g{color:var(--red);text-shadow:0 0 22px rgba(255,255,255,.55)}
.mark .y{color:var(--y-color);text-shadow:0 0 22px rgba(255,255,255,.4)}
.rule{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--hero-ink)}
.rule i{height:1px;background:var(--hero-ink);opacity:.65;flex:1;max-width:190px}
.rule b{font-size:clamp(15px,3.6vw,24px);font-weight:900;letter-spacing:.02em;white-space:nowrap}
.meta{margin-top:8px;font-size:clamp(12px,2.8vw,15px);color:var(--hero-ink);font-weight:500}
.conn{margin-top:10px;font-size:12px;color:var(--hero-ink);display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.55);padding:3px 10px;border-radius:99px}
@media (prefers-color-scheme: dark){.conn{background:rgba(255,255,255,.1)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.bad{background:var(--live)}
/* 탭 */
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:0 0 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav a{padding:12px 16px;color:var(--muted);text-decoration:none;font-weight:700;white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-2px}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red)}
nav a.ext{margin-left:auto;color:var(--royal)}
@media (max-width:480px){nav a{padding:12px 10px}}
a:focus-visible,button:focus-visible{outline:3px solid var(--royal);outline-offset:2px}
.banner.sw{border-left-color:var(--red);color:var(--ink);font-size:14px}
.banner.sw a{color:var(--royal);font-weight:700;margin-left:6px;white-space:nowrap}
.banner{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
h2{font-size:16px;margin:22px 0 10px;letter-spacing:.04em}
/* 표 */
table{width:100%;border-collapse:collapse;background:var(--surface);font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:#fff;background:var(--navy);font-weight:500;white-space:nowrap}
@media (prefers-color-scheme: dark){th{color:var(--bg)}}
td.team{text-align:left;font-weight:700}
td.team small{font-weight:400;color:var(--muted);margin-left:6px}
tr.r1 td:first-child{box-shadow:inset 5px 0 var(--gold)} tr.r2 td:first-child{box-shadow:inset 5px 0 var(--silver)} tr.r3 td:first-child{box-shadow:inset 5px 0 var(--bronze)}
.rk{font-family:var(--f-display);font-size:18px;color:var(--royal)}
.pts{font-weight:900;font-size:17px;color:var(--royal)}
.tie{font-size:11px;color:var(--warn)}
.scroll{overflow-x:auto}
.ann{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--red);padding:10px 12px;margin-bottom:14px;font-size:14px}
.ann b{font-variant-numeric:tabular-nums;color:var(--royal)}
/* 구장별 */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.court{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--cc)}
.court h3{margin:0;padding:10px 12px 0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.court h3 span{font-size:12px;color:var(--muted);font-weight:400}
.m{padding:10px 12px;border-top:1px solid var(--line)}
.m:first-of-type{border-top:0}
.mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
.tn{font-weight:500;min-width:0;overflow-wrap:anywhere}
.tn.w{font-weight:900}
.sc{font-family:var(--f-display);font-size:24px;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--royal)}
.done-t{color:var(--ok);font-weight:700} .wait-t{color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.actions{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.poster{background:#fff;border:1px solid var(--line);overflow-x:auto}
.poster svg{display:block;width:100%;height:auto;min-width:640px}
/* 대진표 (LIST OF MATCHES 스타일): 진한 블루 그라데이션 위에 흰 글씨, 3열 블록 */
.fx{position:relative;overflow:hidden;color:#fff;padding:clamp(20px,5vw,44px);
  background:radial-gradient(55% 45% at 88% 0%,rgba(111,174,239,.55),transparent 68%),radial-gradient(60% 55% at 0% 100%,rgba(42,82,168,.95),transparent 70%),linear-gradient(160deg,#0E2356 0%,#173A86 55%,#2A52A8 100%)}
.fx-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap}
.fx h2{font-family:var(--f-mark);font-weight:400;font-size:clamp(40px,10.4vw,80px);line-height:.92;margin:0;letter-spacing:.01em;color:#fff}
.fx-kr{font-size:clamp(12px,2.6vw,16px);letter-spacing:.22em;color:#CFE0FA;margin-top:8px;font-weight:500}
.fx-logo{font-family:var(--f-mark);font-size:clamp(20px,4vw,30px);line-height:1;transform:skewX(-8deg);white-space:nowrap}
.fx-logo .g{color:#FF4B50} .fx-logo .y{color:#fff}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(24px,4vw,40px) clamp(20px,3.5vw,40px);margin-top:clamp(24px,4vw,40px)}
.fx-b h3{font-family:var(--f-mark);font-weight:400;font-size:clamp(24px,3.6vw,32px);letter-spacing:.04em;margin:0;padding-bottom:8px;border-bottom:2px solid rgba(255,255,255,.85);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fx-b h3 small{font-family:var(--f-body);font-size:12px;letter-spacing:.03em;color:#BFD3F5;font-weight:500}
.fx-b.fxf h3{color:#FFD76A;border-bottom-color:#FFD76A}
.fx-r{display:grid;grid-template-columns:22px 1fr 34px 1fr;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.fx-r .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#0E2356;background:var(--cc)}
.fx-r .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-r .t.h{text-align:right}
.fx-r .t.l{opacity:.5}
.fx-r .v{font-size:11px;color:#9DB8E8;font-weight:500;text-align:center;letter-spacing:.08em}
.fx-r .v.s{font-size:15px;color:#fff;font-weight:900;letter-spacing:0}
.fx-f{padding:14px 0 4px;text-align:center}
.fx-f .t{font-size:clamp(20px,3vw,24px);font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-f .t.l{opacity:.5}
.fx-f .v{font-size:13px;color:#9DB8E8;letter-spacing:.3em;margin:2px 0}
.fx-f .v.s{font-size:clamp(26px,4vw,34px);color:#fff;font-weight:900;letter-spacing:0}
.fx-f .c{display:inline-block;margin-top:10px;padding:5px 14px;border:2px solid #FFD76A;color:#FFD76A;font-weight:900;font-size:14px}
.fx-f .ct{font-size:12px;color:#BFD3F5;margin-top:8px}
.ro{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ro-c{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--royal);padding:12px 14px 8px;min-width:0}
.ro-c h3{margin:0 0 6px;display:flex;align-items:baseline;gap:8px;font-size:15px;color:var(--ink)}
.ro-c .cd{font-family:var(--f-mark);font-size:24px;color:var(--royal);letter-spacing:.03em}
.ro-c .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.ro-c small{color:var(--muted);font-weight:500;font-size:12px}
.ro-c ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.mgn{color:var(--mg);font-weight:700}
.ro-c li.mg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ro-c li i{font-style:normal;font-size:11px}
.mgnote{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--mg);background:var(--surface);font-size:14px}
.ro-c li i{color:var(--mg)}
.ro-c li{padding:6px 0;border-top:1px solid var(--line);font-size:15px;font-weight:500;overflow-wrap:anywhere}
.fx-b.fxs h3{color:#FFD76A;border-bottom-color:#FFD76A}
.fx-f .t.q{color:#FFD76A;animation:qb 1.8s ease-in-out infinite}
@keyframes qb{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fx-f .t.q{animation:none}}
.fx-duo{--g:clamp(20px,3.5vw,40px);display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px) var(--g);margin:clamp(24px,4vw,40px) auto 0}
@media (min-width:760px){.fx-duo{grid-template-columns:1fr 1fr;width:calc((100% - 2*var(--g))*2/3 + var(--g))}}
.fx-duo .fx-b h3{flex-wrap:nowrap;font-size:clamp(22px,2.4vw,26px)}
.fx-duo .fx-b h3 small{white-space:nowrap;font-size:11px;letter-spacing:0}
.fx-q{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.fx-q .cd{font-family:var(--f-mark);font-size:20px;color:#8FBBFF}
.fx-q .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-q .nm.nn{opacity:.5;font-weight:500}
.fx-q .ld{font-size:12px;color:#BFD3F5;white-space:nowrap}
.fx-ct{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px;color:#E6EEFC}
.fx-ct span{display:inline-flex;align-items:center;gap:6px}
.fx-ct em{font-style:normal;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:#0E2356;background:var(--cc)}
.fx-pg{display:grid;grid-template-columns:1fr;margin-top:clamp(24px,4vw,36px);border-top:2px solid rgba(255,255,255,.85)}
@media (min-width:760px){.fx-pg{grid-template-columns:1fr 1fr;column-gap:clamp(20px,3.5vw,40px)}}
.fx-pg .tl{display:grid;grid-template-columns:128px 1fr;column-gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.fx-pg .tl b{font-family:var(--f-mark);font-weight:400;font-size:19px;letter-spacing:.03em;color:#fff;white-space:nowrap}
.fx-pg .tl span{font-size:14px;color:#E6EEFC;font-weight:500}
.fx-pg .tl small{grid-column:2;margin-top:3px;font-size:12px;line-height:1.45;color:#BFD3F5}
.fx-pg .rest b{color:#9DB8E8}.fx-pg .rest span{color:#9DB8E8;font-size:13px;font-weight:400}
.fx-pg .fn b,.fx-pg .fn span{color:#FFD76A;font-weight:700}
.fx-note{margin:clamp(22px,4vw,36px) 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.3);font-size:12px;color:#BFD3F5;display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between}

/* 관제 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--royal);padding:12px}
.kpi small{color:var(--muted);display:block;font-size:12px}
.kpi b{font-size:22px;font-family:var(--f-display);font-weight:400;display:block;margin:2px 0}
.kpi.ok{border-top-color:var(--ok)} .kpi.bad{border-top-color:var(--live)}
.bar{height:10px;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--royal)}
.chk{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line)}
.chk li{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:10px;font-size:14px}
.chk li:first-child{border-top:0}
.chk .ic{width:1.4em;text-align:center;font-weight:900}
.chk .ok .ic{color:var(--ok)} .chk .bad .ic{color:var(--live)} .chk .info .ic{color:var(--royal)}
.chk .bad{background:color-mix(in srgb,var(--live) 8%,transparent)}
.log{font-variant-numeric:tabular-nums;font-size:13px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-block;padding:10px 14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
/* 하단 행사 띠 */
.foot{margin:28px calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  background:#0E2356;color:#fff;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 24px;font-size:13px}
.foot b{display:block;color:#F2C94C;font-size:12px;letter-spacing:.2em;margin-bottom:2px}
.foot span{font-size:15px;font-weight:700}
.foot small{display:block;opacity:.85;font-size:12px}
.rc{background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.rc h3{margin:0;padding:8px 12px;font-size:14px;background:var(--navy);color:#fff;font-weight:500}
@media (prefers-color-scheme: dark){.rc h3{color:var(--bg)}}
.rc h3 b{font-family:var(--f-display);font-weight:400;font-size:18px;margin-right:6px}
.rr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.rr:first-of-type{border-top:0}
.cb{color:#fff;font-size:12px;font-weight:700;padding:2px 8px;min-width:54px;text-align:center}
.rt{flex:1;font-weight:700;min-width:0}
.rt i{font-weight:400;color:var(--muted);font-style:normal;margin:0 2px}
.sc2{font-family:var(--f-display);font-weight:400;color:var(--royal);font-size:18px}
.gs{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:760px){.gs{grid-template-columns:1fr}}
.gh{margin:0 0 8px;font-size:18px;letter-spacing:.04em}
.gh em{font-style:normal;font-size:12px;color:var(--ok);margin-left:8px;font-weight:700}
.fin{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--red);padding:14px;margin-top:18px}
.fin h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fin .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.fin .tm{font-weight:900;font-size:19px;overflow-wrap:anywhere}
.fin .sc3{font-family:var(--f-display);font-size:34px;color:var(--royal);white-space:nowrap}
.champ{margin-top:12px;background:linear-gradient(90deg,#F2C94C,#FFE9A0);color:#0E2356;padding:14px;text-align:center;font-weight:900;font-size:20px}
.rc.fnl h3{background:var(--red);color:#fff}
tr.r1 td:first-child{box-shadow:inset 5px 0 var(--gold)} tr.r2 td:first-child{box-shadow:inset 5px 0 var(--silver)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;z-index:20;max-width:90vw}
/* 폰 */
th{white-space:nowrap}
@media (max-width:480px){
  th,td{padding:9px 3px}
  table.st th:nth-child(8),table.st td:nth-child(8){display:none}
  td.team small{display:block;margin:0}
}
/* TV */
body.tv{font-size:clamp(18px,2.1vw,32px)}
body.tv .wrap{max-width:1700px}
body.tv .mark{font-size:clamp(40px,6vw,84px);margin:0}
body.tv .sub1,body.tv .meta,body.tv .foot{display:none}
body.tv .hero{padding-top:10px;padding-bottom:8px}
body.tv th,body.tv td{padding:.55em .4em}
body.tv th{font-size:.62em}
body.tv .pts{font-size:1.25em}
body.tv .sc{font-size:1.4em}
body.tv .sub,body.tv .actions{display:none}
body.tv .grid2{grid-template-columns:repeat(2,1fr)}

<script>
(function(){
'use strict';
/* 구글 시트 ID. 주소창의 ?id=... 로 바꿀 수 있다. 시트는 "링크가 있는 모든 사용자: 뷰어"로 공유되어 있어야 한다. */
var SHEET_ID='1I1qpUYfQyXWZH0z3nBtOJCD5YWK5EQpQvlE47NLq9e0';
var POLL_MS=10000;
var q=new URLSearchParams(location.search);
if(q.get('id'))SHEET_ID=q.get('id');
var TEAMS=['A1','A2','A3','A4','B1','B2','B3','B4'];
var CC={1:'#2F6FDB',2:'#C98500',3:'#D6455D',4:'#7A4BC9'};
var CCL={1:'#6EA2FF',2:'#F0B53A',3:'#FF7C92',4:'#B496F2'};
var FONT='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
var MARK='"Anton","Impact","Arial Black","Haettenschweiler",sans-serif';
var HOST='한국프로축구연맹 교육지원팀',PARTNER='대한축구협회, 핏투게더';
var cfg={title:'핏투게더 EPTS 장비 실습',subtitle:'축구산업아카데미 26기 · 대학생 마케터 DAY',date:'2026.11.14 (토)',hours:'17:00 ~ 19:00',place:'천안 코리아풋볼파크',matchMin:13,starts:['17:15','17:33','17:51','18:15'],announce:'18:30',teams:{}};
TEAMS.forEach(function(c,i){cfg.teams[c]={name:'',leader:'',size:[8,8,8,8,8,8,7,7][i]};});
var RES={},ST={},LOG=[],FIN={h:'',a:'',champ:''},ROSTER={},SPECIAL='';
var tab=(location.hash||'#standings').slice(1);
var live=false,gotData=false,lastAt=0,lastChangeAt=0,failCount=0,errMsg='';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function p2(n){return String(n).padStart(2,'0');}
function clock(t){var d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}

/* ---------- 시트 읽기 ---------- */
function parseCSV(t){
  var rows=[],row=[],f='',i=0,inq=false,c;
  while(i<t.length){c=t[i];
    if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else inq=false;}else f+=c;}
    else if(c==='"')inq=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;
    i++;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;}
function sheetURL(name,range){
  return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=0&sheet='+encodeURIComponent(name)+'&range='+range+'&t='+Date.now();}
function sportOf(s){s=String(s||'');return /축구|soccer/i.test(s)?'soccer':(/풋살|futsal/i.test(s)?'futsal':'');}
var SPORT='';
function sportBanner(){return SPORT==='soccer'?'<div class="banner sw"><b>지금은 축구 경기가 진행 중입니다.</b><a href="soccer.html">축구 페이지로 이동 →</a></div>':'';}
async function getSheet(name,range){
  var r=await fetch(sheetURL(name,range),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  var t=await r.text();
  if(/^\s*<(!doctype|html)/i.test(t))throw new Error('로그인 필요(공유 설정 확인)');
  return parseCSV(t);}
function hhmm(s){s=String(s||'').trim();var m=s.match(/(\d{1,2}):(\d{2})/);return m?p2(m[1])+':'+m[2]:'';}
async function refresh(){
  try{
    // 시트의 '공개데이터' 탭: 모든 칸이 글자라 구글이 값을 빼먹지 않는다. 첫 칸(key)으로 찾는다.
    var rows=await getSheet('공개데이터','A1:E60'),K={},R={},S={},RO={};
    rows.forEach(function(r){var k=(r[0]||'').trim();
      if(k==='team'){var code=(r[1]||'').trim();
        if(TEAMS.indexOf(code)>=0)cfg.teams[code]={name:(r[2]||'').trim(),leader:(r[3]||'').trim(),size:+(r[4]||0)||0};}
      else if(k==='match'){var n=+r[1],h=(r[2]||'').trim(),a=(r[3]||'').trim(),s=(r[4]||'').trim();
        if(n>0){S['m'+n]=s;
          if(s==='완료'&&h!==''&&a!==''&&!isNaN(+h)&&!isNaN(+a))R['m'+n]={h:+h,a:+a,done:true};}}
      else if(k==='roster'){var rc=(r[1]||'').trim();if(TEAMS.indexOf(rc)>=0)RO[rc]=(r[2]||'').split('|').map(function(x){x=x.trim();var mg=/^[*★]/.test(x);return {n:x.replace(/^[*★]\s*/,''),m:mg};}).filter(function(o){return o.n;});}
      else if(k)K[k]=(r[1]||'').trim();});
    var st=[1,2,3,4].map(function(i){return hhmm(K['start'+i]);});
    if(st.every(Boolean))cfg.starts=st;
    if(+K.matchMin>0)cfg.matchMin=+K.matchMin;
    if(hhmm(K.announce))cfg.announce=hhmm(K.announce);
    ['title','subtitle','date','hours','place'].forEach(function(k){if(K[k])cfg[k]=K[k];});
    SPORT=sportOf(K.activeSport);
    FIN={h:(K.finalHome||'').trim(),a:(K.finalAway||'').trim(),champ:(K.champion||'').trim()};
    if(!K.title&&!rows.length)throw new Error('데이터 없음');
    if(gotData)diffLog(RES,R);
    ROSTER=RO;SPECIAL=(K.specialCourt||'').trim();RES=R;ST=S;live=true;gotData=true;lastAt=Date.now();failCount=0;errMsg='';
  }catch(e){live=false;failCount++;errMsg=(e&&e.message)||'연결 실패';}
  render();}
function diffLog(o,c){
  schedule().forEach(function(m){var a=o['m'+m.n],b=c['m'+m.n],t=Date.now(),L=(m.stage==='final'?'결승':m.round+'R '+m.court+'구장')+' '+slot(m,'h')+' ';
    if(b&&!a)LOG.unshift({t:t,msg:L+b.h+' : '+b.a+' '+slot(m,'a')+' 반영'});
    else if(b&&a&&(a.h!==b.h||a.a!==b.a))LOG.unshift({t:t,msg:L+a.h+':'+a.a+' → '+b.h+':'+b.a+' '+slot(m,'a')+' 정정'});
    else if(!b&&a)LOG.unshift({t:t,msg:L+a.h+':'+a.a+' '+slot(m,'a')+' 삭제됨(점수 칸 비움)'});});
  if(LOG.length&&LOG[0].t>=Date.now()-50)lastChangeAt=Date.now();
  LOG=LOG.slice(0,30);}

/* ---------- 일정 · 순위 (조별 리그 + 결승) ---------- */
/* A조 4팀, B조 4팀이 각각 리그(팀당 3경기)를 치르고, 각 조 1위가 결승에서 만난다. 시트 '경기기록' 탭의 순서와 같다. */
var SCH=[["A1-A2","A3-A4","B1-B2","B3-B4"],["A1-A3","A2-A4","B1-B3","B2-B4"],["A1-A4","A2-A3","B1-B4","B2-B3"]];
function schedule(){var L=[];
  SCH.forEach(function(row,ri){row.forEach(function(p,ci){var t=p.split('-');
    L.push({n:L.length+1,round:ri+1,court:ci+1,label:(L.length+1)+'경기',hc:t[0],ac:t[1],stage:'league'});});});
  L.push({n:13,round:4,court:1,label:'결승',hc:FIN.h,ac:FIN.a,stage:'final'});
  return L;}
function evalAll(){return schedule().map(function(m){var rec=RES['m'+m.n]||null;
  return Object.assign({},m,{rec:rec,state:rec?'done':'wait',done:!!rec});});}
/* 팀명이 비어 있거나 코드(A1~B4)와 같으면 아직 정해지지 않은 임시 이름으로 본다. */
function hasName(c){var t=cfg.teams[c];return !!(t&&t.name&&t.name!==c);}
function tag(c){return hasName(c)?cfg.teams[c].name:c;}
function tagFull(c){return hasName(c)?c+' '+cfg.teams[c].name:c;}
function slot(m,side){var c=side==='h'?m.hc:m.ac;return c?tag(c):(side==='h'?'A조 1위':'B조 1위');}
function slotFull(m,side){var c=side==='h'?m.hc:m.ac;return c?tagFull(c):(side==='h'?'A조 1위':'B조 1위');}
function grpDone(ev,g){return ev.filter(function(e){return e.stage==='league'&&e.hc[0]===g&&e.done;}).length===6;}
function standings(ev,grp){
  var codes=TEAMS.filter(function(c){return c[0]===grp;}),t={};
  codes.forEach(function(c){t[c]={c:c,g:grp,pl:0,w:0,d:0,l:0,gf:0,ga:0};});
  ev.forEach(function(e){if(e.stage!=='league'||!e.done||e.hc[0]!==grp)return;var A=t[e.hc],B=t[e.ac],h=e.rec.h,a=e.rec.a;
    A.pl++;B.pl++;A.gf+=h;A.ga+=a;B.gf+=a;B.ga+=h;
    if(h>a){A.w++;B.l++;}else if(h<a){B.w++;A.l++;}else{A.d++;B.d++;}});
  var rows=codes.map(function(c){var r=t[c];r.gd=r.gf-r.ga;r.pts=r.w*3+r.d;r.key=r.pts*1e7+r.gf*1e3+(r.gd+500);return r;});
  rows.forEach(function(r){r.rank=r.pl?1+rows.filter(function(o){return o.key>r.key;}).length:null;
    r.tie=r.pl>0&&rows.filter(function(o){return o.pl>0&&o.key===r.key;}).length>1;});
  rows.sort(function(a,b){return b.key-a.key||(a.c<b.c?-1:1);});
  return rows;}
function timeOf(round){var s=cfg.starts[round-1]||'00:00',p=s.split(':'),m=+p[0]*60+ +p[1]+ +cfg.matchMin;
  function f(x){x=((x%1440)+1440)%1440;return p2(Math.floor(x/60))+':'+p2(x%60);}
  return {s:s,e:f(m)};}

/* ---------- 화면 ---------- */
function matchHTML(e){
  var r=e.rec,hw=e.done&&r.h>r.a,aw=e.done&&r.a>r.h,tm=timeOf(e.round);
  var st=e.done?'<span class="done-t">종료</span>':'<span class="wait-t">대기</span>';
  return '<div class="m"><div class="mh"><span>'+(e.stage==='final'?'결승':e.round+'R')+' '+tm.s+'~'+tm.e+(e.stage==='final'?'':' · '+esc(e.label))+'</span>'+st+'</div>'+
   '<div class="row"><span class="tn'+(hw?' w':'')+'">'+esc(slot(e,'h'))+'</span><span class="sc">'+(r?r.h:'')+'</span></div>'+
   '<div class="row"><span class="tn'+(aw?' w':'')+'">'+esc(slot(e,'a'))+'</span><span class="sc">'+(r?r.a:'')+'</span></div></div>';}
function tableHTML(rows,g,complete){
  var h='<section><h2 class="gh">'+g+'조 리그'+(complete?'<em>종료</em>':'')+'</h2><div class="scroll"><table class="st"><thead><tr><th>순위</th><th style="text-align:left">팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득</th><th>실</th><th>득실</th><th>승점</th></tr></thead><tbody>';
  rows.forEach(function(r){var cls=r.rank===1?' class="r1"':(r.rank===2?' class="r2"':'');
    h+='<tr'+cls+'><td><span class="rk">'+(r.rank||'-')+'</span>'+(r.tie?'<div class="tie">동률</div>':'')+'</td><td class="team">'+esc(tag(r.c))+(hasName(r.c)?'<small>'+r.c+'</small>':'')+'</td><td>'+r.pl+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+r.gf+'</td><td>'+r.ga+'</td><td>'+(r.pl?(r.gd>0?'+':'')+r.gd:'-')+'</td><td class="pts">'+r.pts+'</td></tr>';});
  return h+'</tbody></table></div></section>';}
function finalCard(ev){
  var f=ev[12],r=f.rec,tm=timeOf(f.round),h='<section class="fin"><h3><span>결승 · 1구장</span><span class="'+(f.done?'done-t':'wait-t')+'">'+tm.s+' ~ '+tm.e+' · '+(f.done?'종료':'대기')+'</span></h3><div class="vs"><div class="tm">'+esc(slot(f,'h'))+'</div><div class="sc3">'+(r?r.h+' : '+r.a:'VS')+'</div><div class="tm">'+esc(slot(f,'a'))+'</div></div></section>';
  if(FIN.champ)h+='<div class="champ">우승 · '+esc(tag(FIN.champ))+'</div>';
  return h;}
function vStandings(ev){
  var done=ev.filter(function(e){return e.done;}).length,h='<div class="ann"><span>완료 <b>'+done+' / '+ev.length+'</b> 경기</span><span>결승 <b>'+esc(cfg.starts[3])+'</b></span></div>';
  var ca=grpDone(ev,'A'),cb=grpDone(ev,'B'),ra=standings(ev,'A'),rb=standings(ev,'B');
  var wait=[];
  if(ca&&!FIN.h&&ra.filter(function(r){return r.rank===1;}).length>1)wait.push('A조 1위가 동률입니다. 운영진이 정하는 대로 결승 진출 팀이 표시됩니다.');
  if(cb&&!FIN.a&&rb.filter(function(r){return r.rank===1;}).length>1)wait.push('B조 1위가 동률입니다. 운영진이 정하는 대로 결승 진출 팀이 표시됩니다.');
  if(wait.length)h+='<div class="banner">'+wait.map(esc).join('<br>')+'</div>';
  h+='<div class="gs">'+tableHTML(ra,'A',ca)+tableHTML(rb,'B',cb)+'</div>'+finalCard(ev);
  return h+'<p class="sub" style="margin-top:10px">각 조 1위가 결승(1구장)에서 만납니다. 조 순위 기준: 승점 → 다득점 → 골득실. 세 가지가 모두 같으면 &ldquo;동률&rdquo;로 표시하고 추첨으로 정합니다. 종료된 경기만 반영됩니다.</p>';}
function program(){
  var hm=String(cfg.hours).match(/(\d{1,2}:\d{2})/),ps=hm?hhmm(hm[1]):'16:55';
  var L=[{t:ps+'~'+cfg.starts[0],l:'장비 배부·착용 및 준비운동',k:'pre'}];
  for(var r=1;r<=3;r++){var tm=timeOf(r);L.push({t:tm.s+'~'+tm.e,l:'ROUND '+r,k:'rd'});
    var nx=r<3?cfg.starts[r]:cfg.starts[3];
    L.push(r<3?{t:tm.e+'~'+nx,l:'휴식·구장 이동',k:'rest'}:{t:tm.e+'~'+nx,l:'휴식·순위 집계·결승 진출팀 발표',k:'rest'});}
  var f=timeOf(4);L.push({t:f.s+'~'+f.e,l:'결승 · 1구장',k:'fn'});
  return L;}
function vBracket(ev){
  function row(e){var r=e.rec,hw=e.done&&r.h>r.a,aw=e.done&&r.a>r.h;
    return '<div class="fx-r" style="--cc:'+CCL[e.court]+'"><span class="n">'+e.court+'</span><span class="t h'+(aw?' l':'')+'">'+esc(tag(e.hc))+'</span>'+
      (e.done?'<span class="v s">'+r.h+':'+r.a+'</span>':'<span class="v">VS</span>')+'<span class="t'+(hw?' l':'')+'">'+esc(tag(e.ac))+'</span></div>';}
  var h='<p class="sub">경기 결과가 들어오면 점수도 함께 표시됩니다.</p><div class="actions"><button class="primary" data-act="png">대진표 이미지(PNG)로 저장</button></div>';
  h+='<div class="fx"><div class="fx-top"><div><h2>LIST OF MATCHES</h2><div class="fx-kr">'+esc(cfg.title)+' 대진표 · 조별 리그 + 결승</div></div><div class="fx-logo"><span class="g">GOAL</span><span class="y">YMPUS</span></div></div>'+
    '<div class="fx-ct"><span><em style="--cc:'+CCL[1]+'">1</em><em style="--cc:'+CCL[2]+'">2</em>A조 리그</span><span><em style="--cc:'+CCL[3]+'">3</em><em style="--cc:'+CCL[4]+'">4</em>B조 리그</span><span><em style="--cc:'+CCL[1]+'">1</em>결승(각 조 1위)</span></div>'+
    '<div class="fx-grid">';
  for(var r=1;r<=3;r++){var tm=timeOf(r);
    h+='<section class="fx-b"><h3>ROUND '+r+'<small>'+tm.s+' – '+tm.e+'</small></h3>'+ev.filter(function(e){return e.round===r;}).map(row).join('')+'</section>';}
  var f=ev[12],t4=timeOf(4),fr=f.rec;
  h+='</div><div class="fx-duo"><section class="fx-b fxf"><h3>FINAL<small>'+t4.s+' – '+t4.e+' · 1구장</small></h3><div class="fx-f"><div class="t'+(f.done&&fr.a>fr.h?' l':'')+'">'+esc(slot(f,'h'))+'</div>'+
    (f.done?'<div class="v s">'+fr.h+' : '+fr.a+'</div>':'<div class="v">VS</div>')+'<div class="t'+(f.done&&fr.h>fr.a?' l':'')+'">'+esc(slot(f,'a'))+'</div>'+
    (FIN.champ?'<div class="c">우승 · '+esc(tag(FIN.champ))+'</div>':'<div class="ct">각 조 1위 맞대결</div>')+'</div></section>'+
    '<section class="fx-b fxs"><h3>SPECIAL MATCH<small>AFTER THE FINAL</small></h3><div class="fx-f"><div class="t q">? ? ?</div><div class="v">VS</div><div class="t q">? ? ?</div></div></section></div>';
  function tl(x){return '<div class="tl '+x.k+'"><b>'+esc(x.t)+'</b><span>'+esc(x.l)+'</span>'+(x.d?'<small>'+esc(x.d)+'</small>':'')+'</div>';}
  var PGL=program();h+='<div class="fx-pg"><div>'+PGL.slice(0,4).map(tl).join('')+'</div><div>'+PGL.slice(4).map(tl).join('')+'</div>'+'</div><div class="fx-note"><span>*경기 시간과 구장은 현장 사정에 따라 변경될 수 있습니다</span><span>'+esc(cfg.date)+' · '+esc(cfg.place)+'</span></div></div>';
  return h;}
function vRoster(){
  var h='<p class="sub">팀 코드별 팀원 명단입니다. 현장에서 팀이 정해지면 팀명도 함께 표시됩니다.</p><p class="mgnote"><span class="mgn">노란색</span> 이름 옆에 &lsquo;매니저&rsquo;가 표시된 분이 팀 매니저입니다. 매니저는 경기 점수 집계와 경기 진행 관리를 맡습니다.</p><div class="ro">';
  TEAMS.forEach(function(c){var m=ROSTER[c]||[];
    h+='<section class="ro-c"><h3><span class="cd">'+c+'</span><span class="nm">'+(hasName(c)?esc(cfg.teams[c].name):'')+'</span><small>'+m.length+'명</small></h3>'+
      (m.length?'<ul>'+m.map(function(o){return '<li'+(o.m?' class="mg"':'')+'>'+(o.m?'<span class="mgn">'+esc(o.n)+'</span><i>매니저</i>':esc(o.n))+'</li>';}).join('')+'</ul>':'<p class="sub">명단 준비 중</p>')+'</section>';});
  return h+'</div>';}
function vCourts(ev){
  var h='<p class="sub">구장마다 어느 팀이 어떤 결과를 냈는지 한눈에 봅니다. A조는 1·2구장, B조는 3·4구장에서 진행하고 결승은 1구장입니다.</p><div class="grid2">';
  [1,2,3,4].forEach(function(c){
    var list=ev.filter(function(e){return e.court===c;}),d=list.filter(function(e){return e.done;}).length,
        g=list.reduce(function(s,e){return s+(e.done?e.rec.h+e.rec.a:0);},0);
    h+='<section class="court" style="--cc:'+CC[c]+'"><h3>'+c+'구장'+(c<=2?' · A조':' · B조')+'<span>'+d+'/'+list.length+' 완료 · 총 '+g+'골</span></h3>'+list.map(matchHTML).join('')+'</section>';});
  return h+'</div>';}

/* 총괄 관제 (#monitor) */
function todayIsEventDay(){var m=cfg.date.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);if(!m)return false;var n=new Date();
  return +m[1]===n.getFullYear()&&+m[2]===n.getMonth()+1&&+m[3]===n.getDate();}
function vMonitor(ev){
  var now=Date.now(),done=ev.filter(function(e){return e.done;}).length;
  var ago=lastAt?Math.round((now-lastAt)/1000):null,chg=lastChangeAt?Math.round((now-lastChangeAt)/1000):null;
  var connOK=live&&ago!=null&&ago<35;
  var h='<p class="sub">총괄 담당용 화면입니다. 입력이 화면에 제대로 반영되는지 확인합니다. (주소 끝에 #monitor)</p><div class="kpis">';
  h+='<div class="kpi '+(connOK?'ok':'bad')+'"><small>시트 연결</small><b>'+(connOK?'정상':'확인 필요')+'</b><small>마지막 성공 '+(lastAt?clock(lastAt)+' ('+ago+'초 전)':'-')+(failCount?' · 연속 실패 '+failCount+'회':'')+'</small></div>';
  h+='<div class="kpi"><small>마지막 점수 반영</small><b>'+(lastChangeAt?clock(lastChangeAt):'아직 없음')+'</b><small>'+(chg!=null?chg+'초 전':'이 화면을 연 뒤 변경 없음')+'</small></div>';
  h+='<div class="kpi"><small>완료 경기</small><b>'+done+' / '+ev.length+'</b><div class="bar"><i style="width:'+Math.round(done/ev.length*100)+'%"></i></div></div></div>';
  h+='<h2>구장별 진행</h2><div class="kpis">';
  [1,2,3,4].forEach(function(c){var tot=ev.filter(function(e){return e.court===c;}).length,d=ev.filter(function(e){return e.court===c&&e.done;}).length;
    h+='<div class="kpi" style="border-top-color:'+CC[c]+'"><small>'+c+'구장 · '+(c<=2?'A조':'B조')+'</small><b>'+d+' / '+tot+'</b><div class="bar"><i style="width:'+Math.round(d/tot*100)+'%;background:'+CC[c]+'"></i></div></div>';});
  h+='</div><h2>입력 점검</h2><ul class="chk">';
  function item(kind,txt){h+='<li class="'+kind+'"><span class="ic">'+(kind==='ok'?'✔':kind==='bad'?'!':'i')+'</span><span>'+txt+'</span></li>';}
  var errs=ev.filter(function(e){return ST['m'+e.n]==='입력오류';});
  errs.length?item('bad','점수가 한쪽만 입력된 경기 '+errs.length+'개: '+errs.map(function(e){return e.n+'경기('+e.court+'구장 '+e.round+'R)';}).join(', ')):item('ok','점수 입력 오류 없음');
  var nn=TEAMS.filter(function(c){return !hasName(c);}).length;
  nn?item('info','팀명 미정 '+nn+'/8팀 (임시로 코드 A1~B4로 표시 중)'):item('ok','팀명 8팀 입력 완료');
  var nl=TEAMS.filter(function(c){return !cfg.teams[c].leader;}).length;
  nl?item('info','팀장 미입력 '+nl+'/8팀'):item('ok','팀장 8명 입력 완료');
  var sum=TEAMS.reduce(function(s,c){return s+(cfg.teams[c].size||0);},0);
  item('info','인원 합계 '+sum+'명 (시트 설정 탭 기준)');
  if(todayIsEventDay()){var nowm=new Date().getHours()*60+new Date().getMinutes();
    var late=ev.filter(function(e){if(e.done)return false;var p=timeOf(e.round).e.split(':');return nowm>+p[0]*60+ +p[1]+3;});
    late.length?item('bad','종료 시각이 지났는데 결과가 없는 경기 '+late.length+'개: '+late.map(function(e){return e.n+'경기('+e.court+'구장 '+e.round+'R)';}).join(', ')):item('ok','지연된 경기 없음');}
  else item('info','오늘은 행사일('+esc(cfg.date)+')이 아니라 지연 점검을 건너뜁니다');
  ['A','B'].forEach(function(g){var rows=standings(ev,g),top=rows.filter(function(r){return r.rank===1;}),done=grpDone(ev,g),fin=g==='A'?FIN.h:FIN.a;
    if(done&&top.length>1&&!fin)item('bad',g+'조 1위가 동률입니다 ('+top.map(function(r){return tag(r.c);}).join(', ')+'). 시트 설정 탭 '+(g==='A'?'I25':'I26')+'에서 '+g+'조 1위를 직접 지정하세요.');
    else if(done&&fin)item('ok',g+'조 1위 확정: '+tag(fin));
    else item('info',g+'조 리그 '+rows.reduce(function(s,r){return s+r.pl;},0)/2+' / 6 경기 완료');});
  if(FIN.h&&FIN.a)item('ok','결승 대진: '+tag(FIN.h)+' vs '+tag(FIN.a)+(FIN.champ?' · 우승 '+tag(FIN.champ):''));
  else item('info','결승 진출 팀은 각 조 6경기가 끝나면 자동으로 정해집니다');
  h+='</ul><h2>최근 반영 기록</h2>';
  h+=LOG.length?'<ul class="chk log">'+LOG.slice(0,12).map(function(l){return '<li class="info"><span class="ic">·</span><span>'+clock(l.t)+' &nbsp;'+esc(l.msg)+'</span></li>';}).join('')+'</ul>':'<p class="sub">이 화면을 연 뒤 새로 입력된 점수가 여기에 쌓입니다.</p>';
  h+='<h2>바로가기</h2><div class="links"><a href="https://docs.google.com/spreadsheets/d/'+esc(SHEET_ID)+'/edit" target="_blank" rel="noopener">입력 시트 열기</a><a href="#standings">참가자 순위 화면</a></div>';
  return h;}

/* ---------- 대진표 포스터 (화면과 PNG 저장 공용) ---------- */
function clip(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function posterSVG(ev){
  var W=1080,M=48,G=36,CWd=(W-2*M-2*G)/3,RH=60,HB=44,BH=HB+4*RH,Y0=330,Y1=Y0+BH+50,H=Y1+BH+280,out='';
  function T(x,y,txt,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-family=\''+(o.m?MARK:FONT)+'\' font-size="'+(o.s||18)+'" font-weight="'+(o.w||400)+'" fill="'+(o.f||'#FFFFFF')+'" text-anchor="'+(o.a||'start')+'"'+(o.ls?' letter-spacing="'+o.ls+'"':'')+(o.op?' opacity="'+o.op+'"':'')+'>'+esc(txt)+'</text>';}
  function head(x,y,t,sm,col,ts){return T(x,y+30,t,{m:1,s:ts||36,f:col||'#FFFFFF',ls:'1'})+T(x+CWd,y+28,sm,{s:ts?12:14,f:col||'#BFD3F5',a:'end'})+'<rect x="'+x+'" y="'+(y+44)+'" width="'+CWd+'" height="2.5" fill="'+(col||'#FFFFFF')+'"/>';}
  function line(x,y){return '<rect x="'+x+'" y="'+y+'" width="'+CWd+'" height="1" fill="#FFFFFF" opacity=".18"/>';}
  out+='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(cfg.title)+' 대진표">';
  out+='<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E2356"/><stop offset=".55" stop-color="#173A86"/><stop offset="1" stop-color="#2A52A8"/></linearGradient>'+
    '<radialGradient id="b1" cx=".85" cy="0" r=".6"><stop offset="0" stop-color="#6FAEEF" stop-opacity=".6"/><stop offset="1" stop-color="#6FAEEF" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="b2" cx="0" cy="1" r=".65"><stop offset="0" stop-color="#2A52A8" stop-opacity=".95"/><stop offset="1" stop-color="#2A52A8" stop-opacity="0"/></radialGradient></defs>';
  out+='<rect width="'+W+'" height="'+H+'" fill="url(#bg)"/><rect width="'+W+'" height="'+H+'" fill="url(#b1)"/><rect width="'+W+'" height="'+H+'" fill="url(#b2)"/>';
  out+=T(M,206,'LIST OF MATCHES',{m:1,s:104,ls:'2'});
  out+=T(M+4,256,cfg.title+' 대진표 · 조별 리그 + 결승',{s:21,w:500,f:'#CFE0FA',ls:'4'});
  out+=T(W-M,150,cfg.subtitle.split('·')[0].trim(),{s:15,w:500,f:'#CFE0FA',a:'end',ls:'2'});
  out+='<g transform="translate('+(W-M)+',206) skewX(-8)"><text x="0" y="0" font-family=\''+MARK+'\' font-size="52" text-anchor="end"><tspan fill="#FF4B50">GOAL</tspan><tspan fill="#FFFFFF">YMPUS</tspan></text></g>';
  /* 위쪽 3블록: 라운드 */
  for(var r=1;r<=3;r++){var x=M+(r-1)*(CWd+G),tm=timeOf(r);
    out+=head(x,Y0+0,'ROUND '+r,tm.s+' – '+tm.e);
    ev.filter(function(e){return e.round===r;}).forEach(function(e,i){var y=Y0+HB+i*RH,cx=x+30+(CWd-30)/2,rec=e.rec,hw=e.done&&rec.h>rec.a,aw=e.done&&rec.a>rec.h;
      out+='<circle cx="'+(x+11)+'" cy="'+(y+RH/2)+'" r="11" fill="'+CCL[e.court]+'"/>'+T(x+11,y+RH/2+5,String(e.court),{s:14,w:900,f:'#0E2356',a:'middle'});
      out+=T(cx-24,y+RH/2+7,clip(tag(e.hc),6).toUpperCase(),{s:20,w:700,a:'end',op:aw?.5:1})+T(cx+24,y+RH/2+7,clip(tag(e.ac),6).toUpperCase(),{s:20,w:700,op:hw?.5:1});
      out+=e.done?T(cx,y+RH/2+7,rec.h+':'+rec.a,{s:20,w:900,a:'middle'}):T(cx,y+RH/2+5,'VS',{s:12,f:'#9DB8E8',a:'middle',ls:'1'});
      out+=line(x,y+RH-1);});}
  /* 아래쪽 2블록: 결승 · 스페셜 매치 (같은 크기, 가운데 묶음) */
  var f=ev[12],t4=timeOf(4),fr=f.rec,gold='#FFD76A',x0=M+(CWd+G)/2,xs=x0+CWd+G;
  out+=head(x0,Y1,'FINAL',t4.s+' – '+t4.e+' · 1구장',gold,28);
  var fc=x0+CWd/2;
  out+=T(fc,Y1+HB+52,clip(slot(f,'h'),9).toUpperCase(),{s:28,w:900,a:'middle',op:f.done&&fr.a>fr.h?.5:1});
  out+=f.done?T(fc,Y1+HB+100,fr.h+' : '+fr.a,{s:38,w:900,a:'middle'}):T(fc,Y1+HB+96,'VS',{s:16,f:'#9DB8E8',a:'middle',ls:'6'});
  out+=T(fc,Y1+HB+148,clip(slot(f,'a'),9).toUpperCase(),{s:28,w:900,a:'middle',op:f.done&&fr.h>fr.a?.5:1});
  out+=FIN.champ?'<rect x="'+(fc-110)+'" y="'+(Y1+HB+176)+'" width="220" height="38" fill="none" stroke="'+gold+'" stroke-width="2.5"/>'+T(fc,Y1+HB+202,'우승 · '+clip(tag(FIN.champ),8),{s:18,w:900,f:gold,a:'middle'}):T(fc,Y1+HB+200,'각 조 1위 맞대결',{s:14,f:'#BFD3F5',a:'middle'});
  out+=head(xs,Y1,'SPECIAL MATCH','AFTER THE FINAL',gold,28);
  var sc=xs+CWd/2;
  out+=T(sc,Y1+HB+52,'? ? ?',{s:28,w:900,f:gold,a:'middle'})+T(sc,Y1+HB+96,'VS',{s:16,f:'#9DB8E8',a:'middle',ls:'6'})+T(sc,Y1+HB+148,'? ? ?',{s:28,w:900,f:gold,a:'middle'});
  var PG=program(),yP=Y1+BH+44,half=Math.ceil(PG.length/2),colW=(W-2*M-G)/2,RHp=46,yy=[yP+14,yP+14],hh=[0,0];
  out+='<rect x="'+M+'" y="'+yP+'" width="'+(W-2*M)+'" height="2.5" fill="#FFFFFF"/>';
  PG.forEach(function(x,i){var c=i<half?0:1,px=M+c*(colW+G),y=yy[c],gold=x.k==='fn',dim=x.k==='rest';
    out+=T(px,y+26,x.t,{m:1,s:22,f:gold?'#FFD76A':(dim?'#9DB8E8':'#FFFFFF')})+T(px+158,y+26,x.l,{s:dim?13:15,w:gold?700:500,f:gold?'#FFD76A':(dim?'#9DB8E8':'#E6EEFC')});
    var h=RHp;
    out+='<rect x="'+px+'" y="'+(y+h-8)+'" width="'+colW+'" height="1" fill="#FFFFFF" opacity=".15"/>';
    yy[c]+=h;});
  var yN=Math.max(yy[0],yy[1])+8;
  out+='<rect x="'+M+'" y="'+yN+'" width="'+(W-2*M)+'" height="1" fill="#FFFFFF" opacity=".35"/>';
  out+=T(M,yN+34,'*경기 시간과 구장은 현장 사정에 따라 변경될 수 있습니다',{s:14,f:'#BFD3F5'});
  out+=T(M,yN+78,'일정',{s:12,w:900,f:gold,ls:'3'})+T(M+54,yN+78,cfg.date+'  '+cfg.hours,{s:16,w:700})+T(M+380,yN+78,'장소',{s:12,w:900,f:gold,ls:'3'})+T(M+434,yN+78,cfg.place,{s:16,w:700});
  out+=T(M,yN+106,'주최',{s:12,w:900,f:gold,ls:'3'})+T(M+54,yN+106,HOST,{s:14,f:'#CFE0FA'})+T(M+380,yN+106,'협력',{s:12,w:900,f:gold,ls:'3'})+T(M+434,yN+106,PARTNER,{s:14,f:'#CFE0FA'});
  return out+'</svg>';}

/* ---------- 저장 (PNG) ---------- */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},2600);}
async function savePNG(){
  try{var svg=posterSVG(evalAll()),img=new Image();
    await new Promise(function(ok,no){img.onload=ok;img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
    var vb=svg.match(/viewBox="0 0 (\d+) (\d+)"/),w=+vb[1],h=+vb[2],c=document.createElement('canvas');c.width=w*2;c.height=h*2;
    var x=c.getContext('2d');x.scale(2,2);x.drawImage(img,0,0,w,h);
    var blob=await new Promise(function(r){c.toBlob(r,'image/png');}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='풋살_대진표.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast('이미지 저장에 실패했습니다.');}}

function render(){
  document.getElementById('ttl').textContent=cfg.title;
  document.getElementById('sub1').textContent=cfg.subtitle.split('·')[0].trim();
  document.getElementById('meta').textContent=cfg.date+' '+cfg.hours+'  |  '+cfg.place+(cfg.subtitle.indexOf('·')>0?'  |  '+cfg.subtitle.split('·').slice(1).join('·').trim():'');
  document.getElementById('foot').innerHTML='<div><b>일정</b><span>'+esc(cfg.date)+'</span><small>'+esc(cfg.hours)+'</small></div><div><b>장소</b><span>'+esc(cfg.place)+'</span></div><div><b>주최</b><small>'+esc(HOST)+'</small><b style="margin-top:6px">협력</b><small>'+esc(PARTNER)+'</small></div>';
  document.title='GOALYMPUS '+cfg.title;
  var T=[['standings','순위'],['roster','명단'],['bracket','대진표'],['courts','구장별']];
  if(tab==='monitor')T.push(['monitor','관제']);
  else if(!T.some(function(x){return x[0]===tab;}))tab='standings';
  document.body.classList.toggle('tv',tab==='tv');
  document.getElementById('nav').innerHTML=T.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===tab?' aria-current="page"':'')+'>'+x[1]+'</a>';}).join('')+'<a class="ext" href="soccer.html">축구 →</a>';
  var dot=document.getElementById('dot'),ct=document.getElementById('connt');
  dot.className='dot'+(live?' on':' bad');
  ct.textContent=live?('실시간 연결됨 · '+clock(lastAt)):(gotData?'연결이 끊겼습니다 · 마지막 화면':'연결 중…');
  document.getElementById('notice').innerHTML=sportBanner()+((!live&&location.protocol==='file:')?'<div class="banner">이 파일을 더블클릭으로 직접 열면 구글 보안 때문에 시트를 읽을 수 없습니다. 같은 폴더의 <b>화면_열기.command</b>로 열거나, 인터넷 주소(GitHub Pages)로 여세요.</div>':((!live&&errMsg)?'<div class="banner">시트를 불러오지 못했습니다 ('+esc(errMsg)+'). 잠시 뒤 자동으로 다시 시도합니다.</div>':''));
  var ev=evalAll(),h='';
  if(tab==='standings')h=vStandings(ev);else if(tab==='bracket')h=vBracket(ev);else if(tab==='monitor')h=vMonitor(ev);
  else if(tab==='roster')h=vRoster();
  else h=vCourts(ev);
  document.getElementById('app').innerHTML=h;}
window.addEventListener('resize',function(){if(tab==='bracket')render();});
window.addEventListener('hashchange',function(){tab=location.hash.slice(1)||'standings';render();window.scrollTo(0,0);});
document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b&&b.dataset.act==='png')savePNG();});
render();refresh();setInterval(refresh,POLL_MS);
setInterval(function(){if(tab==='monitor')render();},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
})();
</script>
