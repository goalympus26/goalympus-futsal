<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOALYMPUS 축구 · 핏투게더 EPTS 장비 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 풋살 index.html의 디자인을 그대로 가져오고, 아래에 축구 전용 스타일을 덧붙인다. */
/* 디자인 기준: GOALYMPUS 포스터. 하늘색 바탕, 빨강 GOAL, 네이비 YMPUS, 로열블루 숫자, 넓게 벌린 한글 소제목.
   구성: 상단 히어로(워드마크) · 탭 · 본문 · 하단 행사 정보 띠. 입력은 구글 시트에서 한다. */
:root{
  --bg:#EAF2FD; --surface:#FFFFFF; --ink:#0E2356; --muted:#5A6B8C; --line:#C9D8EF;
  --navy:#0E2356; --red:#E9232B; --royal:#2A52A8; --sky1:#6FAEEF; --sky2:#BCD9F8;
  --ok:#168A5B; --live:#E9232B; --warn:#B26A00; --gold:#F2C94C; --silver:#C9CFCB; --bronze:#E0A57C;
  --c1:#2F6FDB; --c2:#C98500; --c3:#D6455D; --c4:#7A4BC9;
  --hero-ink:#0E2356; --y-color:#0E2356; --mg:#B07A00;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mark:"Anton","Impact","Arial Black","Haettenschweiler",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1630; --surface:#12254A; --ink:#EAF0FF; --muted:#9DB0D6; --line:#22396B;
  --navy:#EAF0FF; --royal:#7FA6FF; --sky1:#0B1F4D; --sky2:#0A1630; --ok:#4CC28F; --live:#FF6B5E; --warn:#F0B14A;
  --c1:#6EA2FF; --c2:#F0B53A; --c3:#FF7C92; --c4:#B496F2; --hero-ink:#EAF0FF; --y-color:#FFFFFF; --mg:#FFD83A; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(0px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto}
/* 히어로 */
.hero{position:relative;overflow:hidden;text-align:center;
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 20px;
  background:
    radial-gradient(55% 90% at 12% 25%,rgba(255,255,255,.85),transparent 62%),
    radial-gradient(45% 80% at 88% 8%,rgba(255,255,255,.75),transparent 62%),
    radial-gradient(40% 60% at 60% 85%,rgba(255,255,255,.55),transparent 65%),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 75%,var(--bg) 100%);}
@media (prefers-color-scheme: dark){.hero{background:radial-gradient(60% 90% at 20% 0%,rgba(80,130,230,.35),transparent 65%),linear-gradient(180deg,#0B1F4D 0%,#0A1630 100%);}}
.hero-in{max-width:980px;margin:0 auto;position:relative}
.sub1{font-size:clamp(11px,2.6vw,17px);font-weight:500;letter-spacing:.42em;color:var(--hero-ink);padding-left:.42em}
.mark{font-family:var(--f-mark);font-size:clamp(46px,14vw,104px);line-height:1;letter-spacing:-.01em;transform:skewX(-8deg);margin:6px 0 4px;white-space:nowrap}
.mark .g{color:var(--red);text-shadow:0 0 22px rgba(255,255,255,.55)}
.mark .y{color:var(--y-color);text-shadow:0 0 22px rgba(255,255,255,.4)}
.rule{display:flex;align-items:center;gap:14px;justify-content:center;color:var(--hero-ink)}
.rule i{height:1px;background:var(--hero-ink);opacity:.65;flex:1;max-width:190px}
.rule b{font-size:clamp(15px,3.6vw,24px);font-weight:900;letter-spacing:.02em;white-space:nowrap}
.meta{margin-top:8px;font-size:clamp(12px,2.8vw,15px);color:var(--hero-ink);font-weight:500}
.conn{margin-top:10px;font-size:12px;color:var(--hero-ink);display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.55);padding:3px 10px;border-radius:99px}
@media (prefers-color-scheme: dark){.conn{background:rgba(255,255,255,.1)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.bad{background:var(--live)}
/* 탭 */
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:0 0 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav a{padding:12px 16px;color:var(--muted);text-decoration:none;font-weight:700;white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-2px}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red)}
a:focus-visible,button:focus-visible{outline:3px solid var(--royal);outline-offset:2px}
.banner{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
h2{font-size:16px;margin:22px 0 10px;letter-spacing:.04em}
/* 표 */
table{width:100%;border-collapse:collapse;background:var(--surface);font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:#fff;background:var(--navy);font-weight:500;white-space:nowrap}
@media (prefers-color-scheme: dark){th{color:var(--bg)}}
td.team{text-align:left;font-weight:700}
td.team small{font-weight:400;color:var(--muted);margin-left:6px}
tr.r1 td:first-child{box-shadow:inset 5px 0 var(--gold)} tr.r2 td:first-child{box-shadow:inset 5px 0 var(--silver)} tr.r3 td:first-child{box-shadow:inset 5px 0 var(--bronze)}
.rk{font-family:var(--f-display);font-size:18px;color:var(--royal)}
.pts{font-weight:900;font-size:17px;color:var(--royal)}
.tie{font-size:11px;color:var(--warn)}
.scroll{overflow-x:auto}
.ann{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--red);padding:10px 12px;margin-bottom:14px;font-size:14px}
.ann b{font-variant-numeric:tabular-nums;color:var(--royal)}
/* 구장별 */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.court{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--cc)}
.court h3{margin:0;padding:10px 12px 0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.court h3 span{font-size:12px;color:var(--muted);font-weight:400}
.m{padding:10px 12px;border-top:1px solid var(--line)}
.m:first-of-type{border-top:0}
.mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
.tn{font-weight:500;min-width:0;overflow-wrap:anywhere}
.tn.w{font-weight:900}
.sc{font-family:var(--f-display);font-size:24px;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--royal)}
.done-t{color:var(--ok);font-weight:700} .wait-t{color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.actions{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.poster{background:#fff;border:1px solid var(--line);overflow-x:auto}
.poster svg{display:block;width:100%;height:auto;min-width:640px}
/* 대진표 (LIST OF MATCHES 스타일): 진한 블루 그라데이션 위에 흰 글씨, 3열 블록 */
.fx{position:relative;overflow:hidden;color:#fff;padding:clamp(20px,5vw,44px);
  background:radial-gradient(55% 45% at 88% 0%,rgba(111,174,239,.55),transparent 68%),radial-gradient(60% 55% at 0% 100%,rgba(42,82,168,.95),transparent 70%),linear-gradient(160deg,#0E2356 0%,#173A86 55%,#2A52A8 100%)}
.fx-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap}
.fx h2{font-family:var(--f-mark);font-weight:400;font-size:clamp(40px,10.4vw,80px);line-height:.92;margin:0;letter-spacing:.01em;color:#fff}
.fx-kr{font-size:clamp(12px,2.6vw,16px);letter-spacing:.22em;color:#CFE0FA;margin-top:8px;font-weight:500}
.fx-logo{font-family:var(--f-mark);font-size:clamp(20px,4vw,30px);line-height:1;transform:skewX(-8deg);white-space:nowrap}
.fx-logo .g{color:#FF4B50} .fx-logo .y{color:#fff}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(24px,4vw,40px) clamp(20px,3.5vw,40px);margin-top:clamp(24px,4vw,40px)}
.fx-b h3{font-family:var(--f-mark);font-weight:400;font-size:clamp(24px,3.6vw,32px);letter-spacing:.04em;margin:0;padding-bottom:8px;border-bottom:2px solid rgba(255,255,255,.85);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fx-b h3 small{font-family:var(--f-body);font-size:12px;letter-spacing:.03em;color:#BFD3F5;font-weight:500}
.fx-b.fxf h3{color:#FFD76A;border-bottom-color:#FFD76A}
.fx-r{display:grid;grid-template-columns:22px 1fr 34px 1fr;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.fx-r .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#0E2356;background:var(--cc)}
.fx-r .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-r .t.h{text-align:right}
.fx-r .t.l{opacity:.5}
.fx-r .v{font-size:11px;color:#9DB8E8;font-weight:500;text-align:center;letter-spacing:.08em}
.fx-r .v.s{font-size:15px;color:#fff;font-weight:900;letter-spacing:0}
.fx-f{padding:14px 0 4px;text-align:center}
.fx-f .t{font-size:clamp(20px,3vw,24px);font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-f .t.l{opacity:.5}
.fx-f .v{font-size:13px;color:#9DB8E8;letter-spacing:.3em;margin:2px 0}
.fx-f .v.s{font-size:clamp(26px,4vw,34px);color:#fff;font-weight:900;letter-spacing:0}
.fx-f .c{display:inline-block;margin-top:10px;padding:5px 14px;border:2px solid #FFD76A;color:#FFD76A;font-weight:900;font-size:14px}
.fx-f .ct{font-size:12px;color:#BFD3F5;margin-top:8px}
.ro{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ro-c{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--royal);padding:12px 14px 8px;min-width:0}
.ro-c h3{margin:0 0 6px;display:flex;align-items:baseline;gap:8px;font-size:15px;color:var(--ink)}
.ro-c .cd{font-family:var(--f-mark);font-size:24px;color:var(--royal);letter-spacing:.03em}
.ro-c .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.ro-c small{color:var(--muted);font-weight:500;font-size:12px}
.ro-c ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.mgn{color:var(--mg);font-weight:700}
.ro-c li.mg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ro-c li i{font-style:normal;font-size:11px}
.mgnote{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--mg);background:var(--surface);font-size:14px}
.ro-c li i{color:var(--mg)}
.ro-c li{padding:6px 0;border-top:1px solid var(--line);font-size:15px;font-weight:500;overflow-wrap:anywhere}
.fx-b.fxs h3{color:#FFD76A;border-bottom-color:#FFD76A}
.fx-f .t.q{color:#FFD76A;animation:qb 1.8s ease-in-out infinite}
@keyframes qb{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.fx-f .t.q{animation:none}}
.fx-duo{--g:clamp(20px,3.5vw,40px);display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px) var(--g);margin:clamp(24px,4vw,40px) auto 0}
@media (min-width:760px){.fx-duo{grid-template-columns:1fr 1fr;width:calc((100% - 2*var(--g))*2/3 + var(--g))}}
.fx-duo .fx-b h3{flex-wrap:nowrap;font-size:clamp(22px,2.4vw,26px)}
.fx-duo .fx-b h3 small{white-space:nowrap;font-size:11px;letter-spacing:0}
.fx-q{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.fx-q .cd{font-family:var(--f-mark);font-size:20px;color:#8FBBFF}
.fx-q .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-q .nm.nn{opacity:.5;font-weight:500}
.fx-q .ld{font-size:12px;color:#BFD3F5;white-space:nowrap}
.fx-ct{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px;color:#E6EEFC}
.fx-ct span{display:inline-flex;align-items:center;gap:6px}
.fx-ct em{font-style:normal;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:900;color:#0E2356;background:var(--cc)}
.fx-pg{display:grid;grid-template-columns:1fr;margin-top:clamp(24px,4vw,36px);border-top:2px solid rgba(255,255,255,.85)}
@media (min-width:760px){.fx-pg{grid-template-columns:1fr 1fr;column-gap:clamp(20px,3.5vw,40px)}}
.fx-pg .tl{display:grid;grid-template-columns:128px 1fr;column-gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.fx-pg .tl b{font-family:var(--f-mark);font-weight:400;font-size:19px;letter-spacing:.03em;color:#fff;white-space:nowrap}
.fx-pg .tl span{font-size:14px;color:#E6EEFC;font-weight:500}
.fx-pg .tl small{grid-column:2;margin-top:3px;font-size:12px;line-height:1.45;color:#BFD3F5}
.fx-pg .rest b{color:#9DB8E8}.fx-pg .rest span{color:#9DB8E8;font-size:13px;font-weight:400}
.fx-pg .fn b,.fx-pg .fn span{color:#FFD76A;font-weight:700}
.fx-note{margin:clamp(22px,4vw,36px) 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.3);font-size:12px;color:#BFD3F5;display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between}

/* 관제 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--royal);padding:12px}
.kpi small{color:var(--muted);display:block;font-size:12px}
.kpi b{font-size:22px;font-family:var(--f-display);font-weight:400;display:block;margin:2px 0}
.kpi.ok{border-top-color:var(--ok)} .kpi.bad{border-top-color:var(--live)}
.bar{height:10px;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--royal)}
.chk{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line)}
.chk li{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:10px;font-size:14px}
.chk li:first-child{border-top:0}
.chk .ic{width:1.4em;text-align:center;font-weight:900}
.chk .ok .ic{color:var(--ok)} .chk .bad .ic{color:var(--live)} .chk .info .ic{color:var(--royal)}
.chk .bad{background:color-mix(in srgb,var(--live) 8%,transparent)}
.log{font-variant-numeric:tabular-nums;font-size:13px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-block;padding:10px 14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
/* 하단 행사 띠 */
.foot{margin:28px calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  background:#0E2356;color:#fff;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 24px;font-size:13px}
.foot b{display:block;color:#F2C94C;font-size:12px;letter-spacing:.2em;margin-bottom:2px}
.foot span{font-size:15px;font-weight:700}
.foot small{display:block;opacity:.85;font-size:12px}
.rc{background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.rc h3{margin:0;padding:8px 12px;font-size:14px;background:var(--navy);color:#fff;font-weight:500}
@media (prefers-color-scheme: dark){.rc h3{color:var(--bg)}}
.rc h3 b{font-family:var(--f-display);font-weight:400;font-size:18px;margin-right:6px}
.rr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.rr:first-of-type{border-top:0}
.cb{color:#fff;font-size:12px;font-weight:700;padding:2px 8px;min-width:54px;text-align:center}
.rt{flex:1;font-weight:700;min-width:0}
.rt i{font-weight:400;color:var(--muted);font-style:normal;margin:0 2px}
.sc2{font-family:var(--f-display);font-weight:400;color:var(--royal);font-size:18px}
.gs{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:760px){.gs{grid-template-columns:1fr}}
.gh{margin:0 0 8px;font-size:18px;letter-spacing:.04em}
.gh em{font-style:normal;font-size:12px;color:var(--ok);margin-left:8px;font-weight:700}
.fin{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--red);padding:14px;margin-top:18px}
.fin h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fin .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.fin .tm{font-weight:900;font-size:19px;overflow-wrap:anywhere}
.fin .sc3{font-family:var(--f-display);font-size:34px;color:var(--royal);white-space:nowrap}
.champ{margin-top:12px;background:linear-gradient(90deg,#F2C94C,#FFE9A0);color:#0E2356;padding:14px;text-align:center;font-weight:900;font-size:20px}
.rc.fnl h3{background:var(--red);color:#fff}
tr.r1 td:first-child{box-shadow:inset 5px 0 var(--gold)} tr.r2 td:first-child{box-shadow:inset 5px 0 var(--silver)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;z-index:20;max-width:90vw}
/* 폰 */
th{white-space:nowrap}
@media (max-width:480px){
  th,td{padding:9px 3px}
  table.st th:nth-child(8),table.st td:nth-child(8){display:none}
  td.team small{display:block;margin:0}
}
/* TV */
body.tv{font-size:clamp(18px,2.1vw,32px)}
body.tv .wrap{max-width:1700px}
body.tv .mark{font-size:clamp(40px,6vw,84px);margin:0}
body.tv .sub1,body.tv .meta,body.tv .foot{display:none}
body.tv .hero{padding-top:10px;padding-bottom:8px}
body.tv th,body.tv td{padding:.55em .4em}
body.tv th{font-size:.62em}
body.tv .pts{font-size:1.25em}
body.tv .sc{font-size:1.4em}
body.tv .sub,body.tv .actions{display:none}
body.tv .grid2{grid-template-columns:repeat(2,1fr)}
.tvbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:.7em}
.tvbar b{color:var(--ink)}

<div class="toast" id="toast" hidden></div>
<script>
(function(){
'use strict';
/* 축구 페이지 (풋살 index.html과 별도).
   - 명단·행사 정보: 풋살과 같은 시트의 '공개데이터' 탭 (roster, title, date, hours, place, subtitle)
   - 축구 전용 값: 같은 시트의 '축구데이터' 탭. 첫 칸이 sport, 둘째 칸이 soccer 인 행이 있어야 읽는다.
     (구글은 없는 탭 이름을 요청하면 첫 번째 탭을 돌려주므로, 이 표시로 진짜 축구 탭인지 확인한다.)
   - '축구데이터' 탭이 없으면 기본값(A조 vs B조, 스쿼드 자동 배정, 20분 × 3피리어드)으로 보여 준다. */
var SHEET_ID='1I1qpUYfQyXWZH0z3nBtOJCD5YWK5EQpQvlE47NLq9e0';
var POLL_MS=10000;
var q=new URLSearchParams(location.search);
if(q.get('id'))SHEET_ID=q.get('id');
var FUTSAL=['A1','A2','A3','A4','B1','B2','B3','B4'];
var SIDES=['T1','T2'],PN=3;
var TC={T1:'var(--t1)',T2:'var(--t2)'},TCP={T1:'#FF4B50',T2:'#8FBBFF'};
var FONT='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
var MARK='"Anton","Impact","Arial Black","Haettenschweiler",sans-serif';
var HOST='한국프로축구연맹 교육지원팀',PARTNER='대한축구협회, 핏투게더';
var DEF_TEAMS={T1:{name:'TEAM A',leader:'',codes:['A1','A2','A3','A4']},T2:{name:'TEAM B',leader:'',codes:['B1','B2','B3','B4']}};
var cfg={title:'핏투게더 EPTS 장비 실습',subtitle:'축구산업아카데미 26기 · 대학생 마케터 DAY',date:'2026.11.14 (토)',hours:'16:30 ~ 19:00',place:'천안 코리아풋볼파크',
  periodMin:20,starts:['17:15','17:40','18:05'],announce:'18:30',winPts:3,drawPts:1,teams:JSON.parse(JSON.stringify(DEF_TEAMS))};
var FT={},ROSTER={},SQ={T1:null,T2:null},PER={},PK=null,soccerTab=false,LOG=[];
var tab=(location.hash||'#score').slice(1);
var live=false,gotData=false,lastAt=0,lastChangeAt=0,failCount=0,errMsg='';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function p2(n){return String(n).padStart(2,'0');}
function clock(t){var d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());}
function hhmm(s){s=String(s||'').trim();var m=s.match(/(\d{1,2}):(\d{2})/);return m?p2(m[1])+':'+m[2]:'';}
function mins(s){var p=String(s).split(':');return +p[0]*60+ +p[1];}
function fmt(x){x=((x%1440)+1440)%1440;return p2(Math.floor(x/60))+':'+p2(x%60);}
function num(s){s=String(s==null?'':s).trim();return s!==''&&!isNaN(+s)?+s:null;}
function splitNames(s){return String(s||'').split('|').map(function(x){x=x.trim();var mg=/^[*★]/.test(x);return {n:x.replace(/^[*★]\s*/,''),m:mg};}).filter(function(o){return o.n;});}

/* ---------- 시트 읽기 ---------- */
function parseCSV(t){
  var rows=[],row=[],f='',i=0,inq=false,c;
  while(i<t.length){c=t[i];
    if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else inq=false;}else f+=c;}
    else if(c==='"')inq=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;
    i++;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;}
function sheetURL(name,range){
  return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=0&sheet='+encodeURIComponent(name)+'&range='+range+'&t='+Date.now();}
async function getSheet(name,range){
  var r=await fetch(sheetURL(name,range),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  var t=await r.text();
  if(/^\s*<(!doctype|html)/i.test(t))throw new Error('로그인 필요(공유 설정 확인)');
  return parseCSV(t);}
async function refresh(){
  try{
    var res=await Promise.all([getSheet('공개데이터','A1:E60'),getSheet('축구데이터','A1:E80').catch(function(){return null;})]);
    var pub=res[0],soc=res[1],K={},RO={},F={};
    pub.forEach(function(r){var k=(r[0]||'').trim();
      if(k==='roster'){var c=(r[1]||'').trim();if(FUTSAL.indexOf(c)>=0)RO[c]=splitNames(r[2]);}
      else if(k==='team'){var c2=(r[1]||'').trim();if(FUTSAL.indexOf(c2)>=0)F[c2]={name:(r[2]||'').trim(),size:+(r[4]||0)||0};}
      else if(k)K[k]=(r[1]||'').trim();});
    if(!pub.length)throw new Error('데이터 없음');
    ['title','subtitle','date','hours','place'].forEach(function(k){if(K[k])cfg[k]=K[k];});
    /* 축구데이터 탭 */
    var isSoc=!!(soc&&soc.some(function(r){return (r[0]||'').trim()==='sport'&&(r[1]||'').trim().toLowerCase()==='soccer';}));
    var S={},P={},T=JSON.parse(JSON.stringify(DEF_TEAMS)),SQn={T1:null,T2:null},pk=null;
    if(isSoc){
      soc.forEach(function(r){var k=(r[0]||'').trim();
        if(k==='team'){var s=(r[1]||'').trim();if(SIDES.indexOf(s)<0)return;
          var codes=String(r[4]||'').split('|').map(function(x){return x.trim().toUpperCase();}).filter(function(x){return FUTSAL.indexOf(x)>=0;});
          T[s]={name:(r[2]||'').trim()||DEF_TEAMS[s].name,leader:(r[3]||'').trim(),codes:codes.length?codes:DEF_TEAMS[s].codes};}
        else if(k==='squad'){var s2=(r[1]||'').trim(),n=+r[2];if(SIDES.indexOf(s2)<0||!(n>=1&&n<=PN))return;
          var L=splitNames(r[3]);if(!L.length)return;SQn[s2]=SQn[s2]||[[],[],[]];SQn[s2][n-1]=L;}
        else if(k==='period'){var pn=+r[1];if(pn>=1&&pn<=PN)P['p'+pn]={h:num(r[2]),a:num(r[3]),s:(r[4]||'').trim()};}
        else if(k==='pk'){var ph=num(r[1]),pa=num(r[2]);if(ph!=null&&pa!=null)pk={h:ph,a:pa};}
        else if(k)S[k]=(r[1]||'').trim();});
      var st=[1,2,3].map(function(i){return hhmm(S['start'+i]);});
      if(st.every(Boolean))cfg.starts=st;
      if(+S.periodMin>0)cfg.periodMin=+S.periodMin;
      if(hhmm(S.announce))cfg.announce=hhmm(S.announce);
      if(+S.winPts>=0&&S.winPts!=='')cfg.winPts=+S.winPts;
      if(+S.drawPts>=0&&S.drawPts!=='')cfg.drawPts=+S.drawPts;
      ['title','date','hours','place'].forEach(function(k){if(S[k])cfg[k]=S[k];});}
    if(gotData)diffLog(PER,P,PK,pk);
    cfg.teams=T;ROSTER=RO;FT=F;SQ=SQn;PER=P;PK=pk;soccerTab=isSoc;
    live=true;gotData=true;lastAt=Date.now();failCount=0;errMsg='';
  }catch(e){live=false;failCount++;errMsg=(e&&e.message)||'연결 실패';}
  render();}
function diffLog(o,c,opk,cpk){
  var t=Date.now(),n=LOG.length;
  for(var p=1;p<=PN;p++){var a=o['p'+p]||{},b=c['p'+p]||{},ad=a.s==='완료',bd=b.s==='완료',L=p+'피리어드 ';
    if(bd&&!ad)LOG.unshift({t:t,msg:L+tname('T1')+' '+b.h+' : '+b.a+' '+tname('T2')+' 완료'});
    else if(bd&&ad&&(a.h!==b.h||a.a!==b.a))LOG.unshift({t:t,msg:L+a.h+':'+a.a+' → '+b.h+':'+b.a+' 정정'});
    else if(!bd&&ad)LOG.unshift({t:t,msg:L+'완료 취소됨 (상태 칸 변경)'});
    else if(b.s==='진행'&&a.s!=='진행')LOG.unshift({t:t,msg:L+'시작'});}
  if(cpk&&(!opk||opk.h!==cpk.h||opk.a!==cpk.a))LOG.unshift({t:t,msg:'승부차기 '+cpk.h+' : '+cpk.a+' 반영'});
  if(LOG.length>n)lastChangeAt=t;
  LOG=LOG.slice(0,30);}

/* ---------- 팀 · 스쿼드 ---------- */
function tname(s){return cfg.teams[s].name;}
function futsalName(c){var f=FT[c];return f&&f.name&&f.name!==c?f.name:'';}
function members(s){var L=[];cfg.teams[s].codes.forEach(function(c){(ROSTER[c]||[]).forEach(function(o){L.push({n:o.n,m:o.m,c:c});});});return L;}
/* 시트에 스쿼드가 있으면 그대로, 없으면 풋살 팀 순서대로 이어 붙여 3개로 나눈다(앞 스쿼드부터 1명씩 더). */
function squads(s){
  var M=members(s),byName={};M.forEach(function(o){byName[o.n]=o;});
  if(SQ[s]){var seen={};
    var sq=SQ[s].map(function(list){return list.map(function(o){var b=byName[o.n];seen[o.n]=(seen[o.n]||0)+1;return {n:o.n,m:o.m||(b&&b.m),c:b?b.c:''};});});
    return {auto:false,sq:sq,un:M.filter(function(o){return !seen[o.n];}),dup:Object.keys(seen).filter(function(k){return seen[k]>1;}),out:[].concat.apply([],sq).filter(function(o){return !o.c;})};}
  var n=M.length,base=Math.floor(n/PN),ex=n%PN,sq=[],i=0;
  for(var k=0;k<PN;k++){var sz=base+(k<ex?1:0);sq.push(M.slice(i,i+sz));i+=sz;}
  return {auto:true,sq:sq,un:[],dup:[],out:[]};}

/* ---------- 피리어드 · 승점 ---------- */
function timeOf(p){var s=cfg.starts[p-1]||'00:00';return {s:s,e:fmt(mins(s)+ +cfg.periodMin)};}
function periods(){var L=[];
  for(var p=1;p<=PN;p++){var r=PER['p'+p]||{},both=r.h!=null&&r.a!=null,tm=timeOf(p);
    var done=r.s==='완료'&&both,lv=!done&&r.s==='진행';
    L.push({p:p,s:tm.s,e:tm.e,h:both?r.h:null,a:both?r.a:null,raw:r,done:done,live:lv,
      err:(r.s==='완료'&&!both)||((r.h==null)!==(r.a==null)),pend:both&&!done&&!lv});}
  return L;}
function tally(ps){
  var t={pts:[0,0],gf:[0,0],w:[0,0],d:0,done:0};
  ps.forEach(function(x){if(!x.done)return;t.done++;t.gf[0]+=x.h;t.gf[1]+=x.a;
    if(x.h>x.a){t.pts[0]+=cfg.winPts;t.w[0]++;x.gain=[cfg.winPts,0];}
    else if(x.h<x.a){t.pts[1]+=cfg.winPts;t.w[1]++;x.gain=[0,cfg.winPts];}
    else{t.pts[0]+=cfg.drawPts;t.pts[1]+=cfg.drawPts;t.d++;x.gain=[cfg.drawPts,cfg.drawPts];}});
  var rem=PN-t.done,lead=t.pts[0]-t.pts[1],maxGain=rem*cfg.winPts;
  t.winner=null;t.by='';t.needPK=false;
  if(rem===0){
    if(lead!==0){t.winner=lead>0?'T1':'T2';t.by='승점';}
    else if(t.gf[0]!==t.gf[1]){t.winner=t.gf[0]>t.gf[1]?'T1':'T2';t.by='총득점';}
    else{t.needPK=true;if(PK&&PK.h!==PK.a){t.winner=PK.h>PK.a?'T1':'T2';t.by='승부차기';}}}
  else if(Math.abs(lead)>maxGain){t.winner=lead>0?'T1':'T2';t.by='조기 확정';}
  return t;}

/* ---------- 화면 ---------- */
function vScore(){
  var ps=periods(),t=tally(ps),lv=ps.filter(function(x){return x.live;})[0];
  var stt=t.winner&&t.by!=='조기 확정'?'경기 종료':lv?'<span class="live-t">● '+lv.p+'피리어드 진행 중</span>':t.done?(t.done+'피리어드 종료'):'경기 전';
  var h='<section class="sb"><div class="sb-top"><span>'+stt+'</span><span>완료 <b>'+t.done+' / '+PN+'</b> 피리어드 · 결과 발표 <b>'+esc(cfg.announce)+'</b></span></div>';
  h+='<div class="sb-main">'+SIDES.map(function(s,i){var x='<div class="sb-tm" style="--tc:'+TC[s]+'"><b>'+esc(tname(s))+'</b><small>'+esc(cfg.teams[s].codes.join(' · '))+' · '+members(s).length+'명</small></div>';
      return i===0?x+'<div class="sb-pts">'+t.pts[0]+' : '+t.pts[1]+'<small>승점</small></div>':x;}).join('')+'</div>';
  h+='<div class="sb-sub">총득점 <b>'+t.gf[0]+' : '+t.gf[1]+'</b> · 피리어드 승 <b>'+t.w[0]+'</b> 무 <b>'+t.d+'</b> 패 <b>'+t.w[1]+'</b> ('+esc(tname('T1'))+' 기준)'+(PK?' · 승부차기 <b>'+PK.h+' : '+PK.a+'</b>':'')+'</div>';
  if(t.winner)h+='<div class="res win">'+(t.by==='조기 확정'?'승리 확정 · ':'승리 · ')+esc(tname(t.winner))+' <small style="font-weight:700">('+t.by+(t.by==='조기 확정'?': 남은 피리어드와 관계없이 확정':'')+')</small></div>';
  else if(t.needPK)h+='<div class="res wait">승점과 총득점이 모두 같습니다. 승부차기로 승리 팀을 정합니다.</div>';
  h+='</section><div class="pgrid">'+ps.map(function(x){
    var cls=x.done?' done':x.live?' live':'',st=x.done?'<span class="done-t">종료</span>':x.live?'<span class="live-t">진행 중</span>':'<span class="wait-t">대기</span>';
    var show=x.h!=null,hw=x.done&&x.h>x.a,aw=x.done&&x.a>x.h;
    return '<section class="pc'+cls+'"><h3><span>'+x.p+'피리어드</span><small>'+x.s+' ~ '+x.e+' · '+st+'</small></h3>'+

  try{var svg=posterSVG(),img=new Image();
    await new Promise(function(ok,no){img.onload=ok;img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
    var vb=svg.match(/viewBox="0 0 (\d+) (\d+)"/),w=+vb[1],h=+vb[2],c=document.createElement('canvas');c.width=w*2;c.height=h*2;
    var x=c.getContext('2d');x.scale(2,2);x.drawImage(img,0,0,w,h);
    var blob=await new Promise(function(r){c.toBlob(r,'image/png');}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='축구_일정.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){toast('이미지 저장에 실패했습니다.');}}

function render(){
  document.getElementById('ttl').textContent=cfg.title;
  document.getElementById('sub1').textContent=cfg.subtitle.split('·')[0].trim();
  document.getElementById('meta').textContent=cfg.date+' '+cfg.hours+'  |  '+cfg.place+(cfg.subtitle.indexOf('·')>0?'  |  '+cfg.subtitle.split('·').slice(1).join('·').trim():'');
  document.getElementById('foot').innerHTML='<div><b>일정</b><span>'+esc(cfg.date)+'</span><small>'+esc(cfg.hours)+'</small></div><div><b>장소</b><span>'+esc(cfg.place)+'</span></div><div><b>주최</b><small>'+esc(HOST)+'</small><b style="margin-top:6px">협력</b><small>'+esc(PARTNER)+'</small></div>';
  document.title='GOALYMPUS 축구 · '+cfg.title;
  var T=[['score','스코어'],['teams','팀 구성'],['schedule','일정']];
  if(tab==='monitor')T.push(['monitor','관제']);
  else if(!T.some(function(x){return x[0]===tab;}))tab='score';
  document.getElementById('nav').innerHTML=T.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===tab?' aria-current="page"':'')+'>'+x[1]+'</a>';}).join('')+'<a class="ext" href="index.html">풋살 페이지 →</a>';
  var dot=document.getElementById('dot'),ct=document.getElementById('connt');
  dot.className='dot'+(live?' on':' bad');
  ct.textContent=live?('실시간 연결됨 · '+clock(lastAt)):(gotData?'연결이 끊겼습니다 · 마지막 화면':'연결 중…');
  document.getElementById('notice').innerHTML=(!live&&location.protocol==='file:')?'<div class="banner">이 파일을 더블클릭으로 직접 열면 구글 보안 때문에 시트를 읽을 수 없습니다. 인터넷 주소(GitHub Pages)로 여세요.</div>':((!live&&errMsg)?'<div class="banner">시트를 불러오지 못했습니다 ('+esc(errMsg)+'). 잠시 뒤 자동으로 다시 시도합니다.</div>':'');
  var h='';
  if(tab==='teams')h=vTeams();else if(tab==='schedule')h=vSchedule();else if(tab==='monitor')h=vMonitor();else h=vScore();
  document.getElementById('app').innerHTML=h;}
window.addEventListener('hashchange',function(){tab=location.hash.slice(1)||'score';render();window.scrollTo(0,0);});
document.getElementById('app').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b&&b.dataset.act==='png')savePNG();});
render();refresh();setInterval(refresh,POLL_MS);
setInterval(function(){if(tab==='monitor')render();},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
})();
</script>
